[project]
name = "rossmann-sales-forecasting"
version = "2.0.0"
description = "Leak-free six-week sales forecast for 1,115 Rossmann stores, scored on RMSPE."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.4",
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
